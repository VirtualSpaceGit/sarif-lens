name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm pack --dry-run
      - name: Assert zero runtime dependencies
        run: node -e "const p=require('./package.json'); if(Object.keys(p.dependencies||{}).length) process.exit(1)"
      - name: Exercise local Action
        if: matrix.node == 22
        uses: ./
        with:
          baseline: examples/baseline.sarif
          current: examples/current.sarif
          fail-on: none

  required:
    name: ci
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
