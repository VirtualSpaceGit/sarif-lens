<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">SARIF Lens baseline comparison</title>
  <desc id="description">A local SARIF workbench shows two new findings, one updated finding, two fixed findings, and one unchanged finding.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9ff"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#1c2949" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="650" rx="32" fill="url(#background)"/>
  <circle cx="1055" cy="84" r="185" fill="#3157ff" opacity="0.07"/>
  <circle cx="94" cy="600" r="170" fill="#0f9b68" opacity="0.06"/>

  <g filter="url(#shadow)">
    <rect x="64" y="52" width="1072" height="546" rx="22" fill="#fff" stroke="#dfe3eb"/>
  </g>

  <rect x="64" y="52" width="1072" height="58" rx="22" fill="#0b1020"/>
  <rect x="64" y="88" width="1072" height="22" fill="#0b1020"/>
  <circle cx="94" cy="81" r="6" fill="#ff6b6b"/>
  <circle cx="116" cy="81" r="6" fill="#ffd166"/>
  <circle cx="138" cy="81" r="6" fill="#35d393"/>
  <circle cx="192" cy="81" r="13" fill="none" stroke="#fff" stroke-width="4"/>
  <line x1="201" y1="91" x2="210" y2="100" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="224" y="87" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">SARIF Lens</text>
  <text x="1098" y="87" fill="#9aa5bd" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="12">LOCAL ONLY</text>

  <text x="104" y="153" fill="#3157ff" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2">FINDING-LEVEL DELTA</text>
  <text x="104" y="187" fill="#0b1020" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="750">baseline.sarif  ->  current.sarif</text>

  <g transform="translate(104 216)">
    <g>
      <rect width="224" height="100" rx="14" fill="#ffeded"/>
      <text x="18" y="28" fill="#a62f2f" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">NEW</text>
      <text x="18" y="73" fill="#0b1020" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="800">2</text>
    </g>
    <g transform="translate(240)">
      <rect width="224" height="100" rx="14" fill="#fff4d9"/>
      <text x="18" y="28" fill="#88550d" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">UPDATED</text>
      <text x="18" y="73" fill="#0b1020" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="800">1</text>
    </g>
    <g transform="translate(480)">
      <rect width="224" height="100" rx="14" fill="#e4f7ef"/>
      <text x="18" y="28" fill="#08744c" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">FIXED</text>
      <text x="18" y="73" fill="#0b1020" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="800">2</text>
    </g>
    <g transform="translate(720)">
      <rect width="224" height="100" rx="14" fill="#eef0f4"/>
      <text x="18" y="28" fill="#59647a" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">UNCHANGED</text>
      <text x="18" y="73" fill="#0b1020" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="800">1</text>
    </g>
  </g>

  <g transform="translate(104 340)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="944" height="63" rx="12" fill="#fff" stroke="#dfe3eb"/>
    <rect x="16" y="19" width="52" height="25" rx="13" fill="#ffeded"/>
    <text x="42" y="36" text-anchor="middle" fill="#a62f2f" font-size="9" font-weight="800">NEW</text>
    <rect x="82" y="19" width="49" height="25" rx="13" fill="#ffeded"/>
    <text x="106" y="36" text-anchor="middle" fill="#a62f2f" font-size="9" font-weight="800">HIGH</text>
    <text x="151" y="29" fill="#0b1020" font-size="12" font-weight="700">DEMO-005</text>
    <text x="151" y="47" fill="#657087" font-size="11">src/files.py:31</text>
    <text x="330" y="37" fill="#273249" font-size="13">Request path reaches a file read without containment validation.</text>

    <g transform="translate(0 73)">
      <rect width="944" height="63" rx="12" fill="#fff" stroke="#dfe3eb"/>
      <rect x="16" y="19" width="71" height="25" rx="13" fill="#fff4d9"/>
      <text x="51" y="36" text-anchor="middle" fill="#88550d" font-size="9" font-weight="800">UPDATED</text>
      <rect x="101" y="19" width="68" height="25" rx="13" fill="#f2ebff"/>
      <text x="135" y="36" text-anchor="middle" fill="#6a2eb1" font-size="9" font-weight="800">CRITICAL</text>
      <text x="189" y="29" fill="#0b1020" font-size="12" font-weight="700">DEMO-002</text>
      <text x="189" y="47" fill="#657087" font-size="11">src/db.py:48</text>
      <text x="368" y="29" fill="#273249" font-size="13">Raw SQL execution path</text>
      <text x="368" y="48" fill="#657087" font-size="11">matched by fingerprint, changed severity and message</text>
    </g>

    <g transform="translate(0 146)">
      <rect width="944" height="63" rx="12" fill="#fff" stroke="#dfe3eb"/>
      <rect x="16" y="19" width="56" height="25" rx="13" fill="#e4f7ef"/>
      <text x="44" y="36" text-anchor="middle" fill="#08744c" font-size="9" font-weight="800">FIXED</text>
      <rect x="86" y="19" width="49" height="25" rx="13" fill="#ffeded"/>
      <text x="110" y="36" text-anchor="middle" fill="#a62f2f" font-size="9" font-weight="800">HIGH</text>
      <text x="155" y="29" fill="#0b1020" font-size="12" font-weight="700">DEMO-003</text>
      <text x="155" y="47" fill="#657087" font-size="11">src/app.js:18</text>
      <text x="334" y="37" fill="#273249" font-size="13">Runtime expression is evaluated as code.</text>
    </g>
  </g>

  <text x="104" y="574" fill="#657087" font-family="Segoe UI,Arial,sans-serif" font-size="11">No upload  |  No account  |  No telemetry  |  SARIF 2.1.0</text>
  <text x="1096" y="574" fill="#3157ff" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">EXPLAINABLE MATCHING</text>
</svg>

